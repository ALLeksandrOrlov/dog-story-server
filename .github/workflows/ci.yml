name: Docker build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker:
    name: Docker (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      POSTGRES_PASSWORD: disposable-ci-password
      GRAFANA_ADMIN_PASSWORD: disposable-ci-monitoring-password
      COMPOSE_PROJECT_NAME: game-server-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install clang-format==18.1.8
      - run: python3 tools/check_style.py
      - run: python3 -m unittest discover -s tools -p 'test_check_monitoring.py'
      - run: docker compose --profile test build
      - run: docker compose up -d --wait
      - run: docker compose exec -T db createdb -U game game_test
      - run: docker compose --profile test run --rm test
      - run: python3 tests/docker_smoke.py
      - run: python3 tests/client_resource_check.py
      - run: docker compose -f compose.yaml -f compose.monitoring.yaml --profile monitoring up -d --build
      - run: python3 tools/check_monitoring.py
      - name: Container logs
        if: always()
        run: docker compose -f compose.yaml -f compose.monitoring.yaml --profile monitoring logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose -f compose.yaml -f compose.monitoring.yaml --profile monitoring down
