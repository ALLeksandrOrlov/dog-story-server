<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title">
<title id="title">Игровой цикл: вход, движение, сбор, доставка и сохранение рекорда</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a5e6b5"/></marker>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20392e" stroke-width="0.7"/></pattern></defs>
<rect width="1200" height="620" rx="24" fill="#0d1e19"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="52" fill="#a5e6b5" font-size="16" font-weight="700">GAME LOOP / ЖИЗНЕННЫЙ ЦИКЛ ИГРОКА</text><text x="48" y="100" fill="#eaf2ef" font-size="36" font-weight="700">Команды клиента. Правила сервера.</text><rect x="48" y="155" width="258" height="199" rx="18" fill="#142a24" stroke="#2d493e"/><text x="70" y="191" fill="#a5e6b5" font-size="19" font-weight="700">01</text><text x="70" y="239" fill="#eaf2ef" font-size="27" font-weight="700">Войти</text><text x="70" y="280" fill="#a4bbb2" font-size="18" font-weight="400">Карта + имя</text><text x="70" y="310" fill="#a4bbb2" font-size="18" font-weight="400">Токен игрока</text><path d="M306,253 L324,253" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="155" width="258" height="199" rx="18" fill="#142a24" stroke="#2d493e"/><text x="352" y="191" fill="#a5e6b5" font-size="19" font-weight="700">02</text><text x="352" y="239" fill="#eaf2ef" font-size="27" font-weight="700">Двигаться</text><text x="352" y="280" fill="#a4bbb2" font-size="18" font-weight="400">Команды + тики</text><text x="352" y="310" fill="#a4bbb2" font-size="18" font-weight="400">Дороги и границы</text><path d="M588,253 L606,253" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><rect x="612" y="155" width="258" height="199" rx="18" fill="#142a24" stroke="#2d493e"/><text x="634" y="191" fill="#a5e6b5" font-size="19" font-weight="700">03</text><text x="634" y="239" fill="#eaf2ef" font-size="27" font-weight="700">Собрать</text><text x="634" y="280" fill="#a4bbb2" font-size="18" font-weight="400">Подбор предметов</text><text x="634" y="310" fill="#a4bbb2" font-size="18" font-weight="400">Сумка игрока</text><path d="M870,253 L888,253" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><rect x="894" y="155" width="258" height="199" rx="18" fill="#142a24" stroke="#2d493e"/><text x="916" y="191" fill="#a5e6b5" font-size="19" font-weight="700">04</text><text x="916" y="239" fill="#eaf2ef" font-size="27" font-weight="700">Доставить</text><text x="916" y="280" fill="#a4bbb2" font-size="18" font-weight="400">Пункт доставки</text><text x="916" y="310" fill="#a4bbb2" font-size="18" font-weight="400">Начисление очков</text><rect x="48" y="417" width="1104" height="116" rx="18" fill="#142a24" stroke="#2d493e"/><text x="70" y="454" fill="#f6c66d" font-size="24" font-weight="700">Завершение сессии</text><text x="70" y="489" fill="#a4bbb2" font-size="18" font-weight="400">После 15 секунд бездействия результат сохраняется через Repository в PostgreSQL.</text><text x="48" y="583" fill="#a4bbb2" font-size="18" font-weight="400">Значение тайм-аута соответствует текущей конфигурации игры.</text></g></svg>
