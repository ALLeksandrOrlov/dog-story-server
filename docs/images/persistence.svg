<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="677" viewBox="0 0 1200 677" role="img" aria-labelledby="title">
<title id="title">Docker Compose: сервер, PostgreSQL и постоянные тома</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a5e6b5"/></marker>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20392e" stroke-width="0.7"/></pattern></defs>
<rect width="1200" height="677" rx="24" fill="#0d1e19"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="52" fill="#a5e6b5" font-size="16" font-weight="700">PERSISTENCE / DOCKER COMPOSE</text><text x="48" y="100" fill="#eaf2ef" font-size="36" font-weight="700">Два вида данных — два хранилища</text><rect x="48" y="154" width="285" height="142" rx="18" fill="#142a24" stroke="#2d493e"/><text x="70" y="191" fill="#8ec7f7" font-size="24" font-weight="700">Браузер</text><text x="70" y="226" fill="#a4bbb2" font-size="18" font-weight="400">Dog Story + REST API</text><text x="70" y="253" fill="#a4bbb2" font-size="18" font-weight="400">localhost:8080</text><rect x="414" y="154" width="738" height="142" rx="18" fill="#142a24" stroke="#2d493e"/><text x="436" y="191" fill="#a5e6b5" font-size="24" font-weight="700">game / C++ server</text><text x="436" y="226" fill="#a4bbb2" font-size="18" font-weight="400">Игровая симуляция · HTTP API · статические файлы</text><text x="436" y="253" fill="#a4bbb2" font-size="18" font-weight="400">Автоматические тики и периодические снимки</text><path d="M333,223 L406,223" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="402" width="490" height="142" rx="18" fill="#142a24" stroke="#2d493e"/><text x="70" y="439" fill="#a5e6b5" font-size="24" font-weight="700">snapshots / Docker volume</text><text x="70" y="474" fill="#a4bbb2" font-size="18" font-weight="400">Положение, сумка, очки, токены</text><text x="70" y="501" fill="#a4bbb2" font-size="18" font-weight="400">StateStore → файл game.state</text><rect x="662" y="402" width="490" height="142" rx="18" fill="#142a24" stroke="#2d493e"/><text x="684" y="439" fill="#f6c66d" font-size="24" font-weight="700">db / PostgreSQL 16</text><text x="684" y="474" fill="#a4bbb2" font-size="18" font-weight="400">Результаты завершённых сессий</text><text x="684" y="501" fill="#a4bbb2" font-size="18" font-weight="400">Repository → SQL → том database</text><path d="M600 296V345H292V394" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><path d="M909,296 L909,394" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><text x="79" y="374" fill="#a5e6b5" font-size="19" font-weight="700">Активная игра</text><text x="687" y="374" fill="#f6c66d" font-size="19" font-weight="700">Таблица рекордов</text><text x="48" y="598" fill="#a4bbb2" font-size="18" font-weight="400">Тома сохраняются после docker compose down. База доступна только внутри сети Compose.</text><text x="48" y="633" fill="#a4bbb2" font-size="17" font-weight="400">Снимок и рекорд в БД не объединены общей транзакцией.</text></g></svg>
