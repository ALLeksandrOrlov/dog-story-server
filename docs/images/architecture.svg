<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#20392e" stroke-width="0.7"/></pattern></defs>
<rect width="1200" height="620" rx="24" fill="#0d1e19"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="52" fill="#a5e6b5" font-size="16" font-weight="700">ARCHITECTURE / ОБРАБОТКА ЗАПРОСА</text><text x="48" y="100" fill="#eaf2ef" font-size="38" font-weight="700">От HTTP к игровой модели</text><rect x="48" y="148" width="250" height="136" rx="18" fill="#142a24" stroke="#2d493e"/><text x="70" y="185" fill="#a5e6b5" font-size="24" font-weight="700">Контроллер</text><text x="70" y="220" fill="#a4bbb2" font-size="18" font-weight="400">Маршрут и авторизация</text><text x="70" y="247" fill="#a4bbb2" font-size="18" font-weight="400">Валидация запроса</text><rect x="366" y="148" width="328" height="136" rx="18" fill="#142a24" stroke="#2d493e"/><text x="388" y="185" fill="#a5e6b5" font-size="24" font-weight="700">Application</text><text x="388" y="220" fill="#a4bbb2" font-size="18" font-weight="400">Вход, команды, состояние</text><text x="388" y="247" fill="#a4bbb2" font-size="18" font-weight="400">Координация сохранения</text><rect x="762" y="148" width="390" height="136" rx="18" fill="#142a24" stroke="#2d493e"/><text x="784" y="185" fill="#a5e6b5" font-size="24" font-weight="700">Domain</text><text x="784" y="220" fill="#a4bbb2" font-size="18" font-weight="400">Game · Session · Dog · Map</text><text x="784" y="247" fill="#a4bbb2" font-size="18" font-weight="400">Движение, сбор, очки</text><path d="M298,211 L360,211" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><path d="M694,211 L756,211" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="368" width="250" height="140" rx="18" fill="#142a24" stroke="#2d493e"/><text x="70" y="405" fill="#8ec7f7" font-size="24" font-weight="700">JSON View</text><text x="70" y="440" fill="#a4bbb2" font-size="18" font-weight="400">Сериализация результата</text><text x="70" y="467" fill="#a4bbb2" font-size="18" font-weight="400">JSON для HTTP-ответа</text><path d="M172,284 L172,360" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><text x="189" y="329" fill="#a4bbb2" font-size="16" font-weight="400">ответ</text><rect x="366" y="368" width="328" height="140" rx="18" fill="#142a24" stroke="#2d493e"/><text x="388" y="405" fill="#f6c66d" font-size="24" font-weight="700">Repository</text><text x="388" y="440" fill="#a4bbb2" font-size="18" font-weight="400">Интерфейс домена</text><text x="388" y="467" fill="#a4bbb2" font-size="18" font-weight="400">Рекорды завершённых игр</text><path d="M530,284 L530,360" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><rect x="762" y="368" width="390" height="140" rx="18" fill="#142a24" stroke="#2d493e"/><text x="784" y="405" fill="#f6c66d" font-size="24" font-weight="700">PostgreSQL adapter</text><text x="784" y="440" fill="#a4bbb2" font-size="18" font-weight="400">Реализует Repository</text><text x="784" y="467" fill="#a4bbb2" font-size="18" font-weight="400">SQL и подключение к БД</text><path d="M762,438 L702,438" fill="none" stroke="#a5e6b5" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="335" fill="#a4bbb2" font-size="16" font-weight="400">реализация интерфейса</text><text x="48" y="569" fill="#a4bbb2" font-size="19" font-weight="400">HTTP-транспорт: Boost.Beast / Asio. Операции игры и тики выполняются в одном strand.</text></g></svg>
