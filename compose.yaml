services:
  db:
    restart: unless-stopped
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      timeout: 3s
      retries: 10
  game:
    restart: unless-stopped
    image: dog-story:local
    build: .
    ports:
      - "127.0.0.1:${GAME_HTTP_PORT:-8080}:8080"
    environment:
      GAME_DB_URL: postgresql://game:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/game
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - snapshots:/app/state
  test:
    profiles: [test]
    image: dog-story:test
    build:
      context: .
      target: build
    environment:
      GAME_TEST_DB_URL: postgresql://game:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/game_test
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python3 tools/run_http_integration.py build/build/Release/game_server &&
        python3 tests/api_edge_check.py build/build/Release/game_server &&
        python3 tests/runtime_failure_check.py build/build/Release/game_server &&
        python3 tests/original_client_http.py build/build/Release/game_server
volumes:
  database:
  snapshots:
